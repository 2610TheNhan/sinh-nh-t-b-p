<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chúc mừng sinh nhật bé Bắp</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#dcebff;--ink:#1b1f4b;--pink:#ff4f8b;--sun:#ffc93c;--card:#ffffff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171a3d;--ink:#f3f4ff;--card:#232759}}
:root[data-theme="dark"]{--bg:#171a3d;--ink:#f3f4ff;--card:#232759}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:"Baloo 2",system-ui,sans-serif;
display:flex;flex-direction:column;align-items:center;text-align:center;padding:32px 20px 56px;overflow-x:hidden}
canvas{position:fixed;inset:0;pointer-events:none;z-index:5}
h1{font-size:clamp(2.2rem,8.5vw,4.4rem);line-height:1.08;margin:8px 0 4px;font-weight:800}
h1 .name{color:var(--pink)}
.sub{font-size:1.15rem;margin:0 0 8px;opacity:.8;transition:opacity .6s}
.cake{width:min(320px,80vw);margin:12px auto 24px;cursor:pointer;border-radius:20px}
.cake:focus-visible{outline:3px solid var(--ink);outline-offset:4px}
.flame{transform-origin:50% 100%;animation:fl .5s ease-in-out infinite alternate;transition:opacity .3s}
.out .flame{opacity:0;animation:none}
.out{cursor:default}
@keyframes fl{from{transform:scale(1,1) rotate(-3deg)}to{transform:scale(.88,1.12) rotate(3deg)}}
.card{background:var(--card);border-radius:24px;padding:22px;max-width:760px;width:100%;text-align:left;box-shadow:0 6px 0 rgba(27,31,75,.12)}
.card[hidden]{display:none}
.card.show{animation:pop 1s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.card-body{display:grid;grid-template-columns:1fr 1.3fr;gap:24px;align-items:start}
.photo{aspect-ratio:3/4;border-radius:18px;overflow:hidden;background:rgba(255,79,139,.1)}
.photo img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity 2s ease}
.photo img.on{opacity:1}
.text h2{margin:0 0 8px;font-size:1.8rem;color:var(--pink)}
.msg{margin:0;font-size:1.12rem;line-height:1.6;font-weight:500;white-space:pre-wrap}
.ghost{visibility:hidden}
.from{margin-top:18px;text-align:right;font-weight:800;font-size:1.2rem;color:var(--pink);opacity:0;transition:opacity 1.5s}
.from.on{opacity:1}
@media (max-width:560px){.card-body{grid-template-columns:1fr}.photo{aspect-ratio:4/5}}
@media (prefers-reduced-motion:reduce){.flame{animation:none}.card.show{animation:none}.photo img{transition:none}}
</style>
</head>

    <!-- NỘI DUNG BÊN PHẢI: sửa lời chúc trong biến TEXT ở phần script bên dưới -->
    <div class="text">
      <h2>Gửi Bắp,</h2>
      <p class="msg"><span id="typed"></span><span class="ghost" id="ghost"></span></p>
    </div>
  </div>
  <div class="from" id="from">From The Nhan</div>
</section>

<script>
const $=id=>document.getElementById(id);
const TEXT="Chúc em lúc nào cũng vui vẻ, gặp nhiều may mắn và mọi chuyện đều thuận lợi nha.\n\nMong là thời gian tới anh vẫn có thể ở bên em, cùng em đi chơi, nói chuyện và chia sẻ với nhau nhiều hơn.\n\nAnh không dám nói trước điều gì, nhưng nếu được thì anh muốn mình cứ như vậy thật lâu, rồi biết đâu sau này lại thành một phần quan trọng của nhau. ❤️";
const SPEED=55; // mili giây mỗi ký tự, tăng số này để chữ hiện chậm hơn

const cv=$("c"),cx=cv.getContext("2d");let P=[];
function size(){cv.width=innerWidth;cv.height=innerHeight}size();addEventListener("resize",size);
const cols=["#ff4f8b","#ffc93c","#5fd6b0","#6c8cff","#ff8a3d"];
function boom(n){
  const was=P.length;
  for(let i=0;i<n;i++)P.push({x:innerWidth/2+(Math.random()-.5)*120,y:innerHeight*.4,
  vx:(Math.random()-.5)*14,vy:-Math.random()*13-3,w:6+Math.random()*6,h:4+Math.random()*6,
  r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[i%cols.length]});
  if(!was)loop();
}
function loop(){
  cx.clearRect(0,0,cv.width,cv.height);
  P=P.filter(p=>p.y<innerHeight+20);
  for(const p of P){p.vy+=.3;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.restore()}
  if(P.length)requestAnimationFrame(loop);
}

function type(){
  const chars=Array.from(TEXT);let i=0;
  $("ghost").textContent=TEXT;
  const fast=matchMedia("(prefers-reduced-motion:reduce)").matches;
  (function step(){
    i=fast?chars.length:i+1;
    $("typed").textContent=chars.slice(0,i).join("");
    $("ghost").textContent=chars.slice(i).join("");
    if(i<chars.length)setTimeout(step,SPEED);
    else setTimeout(()=>$("from").classList.add("on"),600);
  })();
}

let done=false;
function blow(){
  if(done)return;done=true;
  const cake=$("cake");
  cake.classList.add("out");cake.removeAttribute("tabindex");cake.removeAttribute("role");
  $("hint").style.opacity=0;
  boom(140);
  const card=$("card");
  setTimeout(()=>{
    card.hidden=false;card.classList.add("show");
    card.scrollIntoView({behavior:"smooth",block:"center"});
    setTimeout(()=>$("pic").classList.add("on"),600);   // hiện ảnh trước
    setTimeout(type,3200);                              // rồi mới viết lời chúc
  },1500);
}
$("cake").addEventListener("click",blow);
$("cake").addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();blow()}});
</script>
